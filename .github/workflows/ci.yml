name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 430986758702.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: juice-shop
  IMAGE_TAG: latest

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:all && npm run test:security

  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check current source for secrets
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --config /repo/.gitleaks.toml --exit-code 0

      - name: Run Gitleaks container
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --verbose --redact --exit-code 0 \
            --report-format json --report-path /repo/gitleaks.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json

  njsscan:
    name: NJS scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install njsscan
        run: pip install njsscan

      - name: Run njsscan
        run: |
          njsscan . || true
          njsscan . --defectdojo -o njsscan.json || true

      - name: Upload njsscan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan-report
          path: njsscan.json

  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --metrics=off \
            --verbose \
            --json-output=semgrep.json || true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json

  retirejs:
    name: Retire.js scan
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node scripts/remove-unused-benchmarks.js
          npm ci --prefix frontend --ignore-scripts || npm install --prefix frontend --ignore-scripts

      - name: Install Retire.js
        run: npm install -g retire

      - name: Run Retire.js
        run: |
          retire --path . --outputformat json --outputpath retirejs.json --exitwith 0

      - name: Upload Retire.js report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirejs-report
          path: retirejs.json

  defectdojo:
    name: Upload reports to DefectDojo
    needs: [gitleaks, njsscan, semgrep, retirejs]
    if: always()
    runs-on: ubuntu-24.04
    env:
      DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download scan reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report'
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Upload Gitleaks report
        run: python upload-report.py gitleaks.json "Gitleaks Scan"
        continue-on-error: true

      - name: Upload njsscan report
        run: python upload-report.py njsscan.json "Generic Findings Import"
        continue-on-error: true

      - name: Upload Semgrep report
        run: python upload-report.py semgrep.json "Semgrep JSON Report"
        continue-on-error: true

      - name: Upload Retire.js report
        run: python upload-report.py retirejs.json "Retire.js Scan"
        continue-on-error: true

  build:
    name: Build and publish Docker image to ECR
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy image to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ec2-deployment
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and run image on EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST || '18.215.233.13' }}
          EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
          EC2_PORT: ${{ vars.EC2_PORT || '80' }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: bash scripts/deploy-ec2.sh
