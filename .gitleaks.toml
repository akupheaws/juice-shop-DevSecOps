title = "Juice Shop reviewed test fixtures"

[extend]
useDefault = true

[allowlist]
description = "Installed third-party packages (scanned separately) and generated Angular compiler caches"
paths = ['''(^|/)node_modules/''', '''^frontend/\.angular/''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed synthetic credentials; never used outside NODE_ENV=test"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^frontend/src/app/oauth/oauth\.component\.spec\.ts$''',
  '''^test/api/2faSpec\.ts$''',
  '''^test/api/basketApiSpec\.ts$''',
  '''^test/api/chatBotSpec\.ts$''',
  '''^test/api/dataExportApiSpec\.ts$''',
  '''^test/api/erasureRequestApiSpec\.ts$''',
  '''^test/api/feedbackApiSpec\.ts$''',
  '''^test/api/loginApiSpec\.ts$''',
  '''^test/api/productReviewApiSpec\.ts$''',
  '''^test/api/userApiSpec\.ts$''',
  '''^test/cypress/integration/e2e/login\.spec\.ts$''',
  '''^test/cypress/integration/e2e/totpSetup\.spec\.ts$''',
  '''^test/fixtures/seed\-credentials\.json$''',
]
regexes = [
  '''^0192023a7bbd73250516f069df18b500$''',
  '''^IFTXE3SPOEYVURT2MRYGI52TKJ4HC3KH$''',
  '''^bW9jLmxpYW1nQGhjaW5pbW1pay5ucmVvamI=$''',
  '''^bW9jLnRzZXRAdHNldA==$''',
]

